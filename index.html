<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto ACJ - Mapa de Tiempos y Distancias en Tiempo Real</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        #map { height: calc(100vh - 72px); width: 100%; }
        .leaflet-popup-content-wrapper {
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.15), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            padding: 0;
            overflow: hidden;
        }
        .leaflet-popup-content { margin: 0; line-height: 1.5; }
        .pulse-sede {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-ring {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); opacity: 0.85; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col h-screen overflow-hidden">

    <!-- HEADER / NAVBAR -->
    <header class="h-[72px] bg-slate-950 border-b border-slate-800 px-6 flex items-center justify-between z-30">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-cyan-400 flex items-center justify-center font-black text-xl shadow-lg shadow-indigo-500/20">
                A
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                    Proyecto ACJ <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">Tráfico Waze en Vivo</span>
                </h1>
                <p class="text-xs text-slate-400">Sede La Soledad (Transversal 28B # 37-33, Bogotá)</p>
            </div>
        </div>

        <!-- QUICK STATS -->
        <div class="hidden md:flex items-center gap-4 text-xs">
            <div class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 flex items-center gap-3">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <div>
                    <div class="text-slate-400">Total Personas</div>
                    <div class="text-sm font-bold text-white" id="stat-total">85</div>
                </div>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-2">
                <div class="text-slate-400">Tiempo Promedio</div>
                <div class="text-sm font-bold text-indigo-300" id="stat-tiempo-prom">-</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-2">
                <div class="text-slate-400">Distancia Promedio</div>
                <div class="text-sm font-bold text-cyan-300" id="stat-dist-prom">-</div>
            </div>
        </div>
    </header>

    <!-- MAIN APP LAYOUT -->
    <div class="flex flex-1 relative overflow-hidden">
        
        <!-- SIDEBAR FILTER / LIST -->
        <aside class="w-80 lg:w-96 bg-slate-950/95 backdrop-blur border-r border-slate-800 flex flex-col z-20 transition-all duration-300">
            <!-- Search & Filters -->
            <div class="p-4 border-b border-slate-800 space-y-3">
                <div class="relative">
                    <input type="text" id="input-buscar" placeholder="Buscar por nombre, barrio, vía..." 
                           class="w-full bg-slate-900 border border-slate-700 text-sm rounded-xl px-4 py-2.5 pl-10 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                    <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>

                <!-- Filter badges -->
                <div class="flex flex-wrap gap-1.5 text-[11px] font-medium">
                    <button onclick="filtrarCategoria('todos')" class="filter-btn active px-2.5 py-1 rounded-lg bg-indigo-600 text-white hover:bg-indigo-500 transition" data-cat="todos">Todos</button>
                    <button onclick="filtrarCategoria('bajo')" class="filter-btn px-2.5 py-1 rounded-lg bg-slate-900 border border-slate-800 text-emerald-400 hover:bg-slate-800 transition" data-cat="bajo">&lt;25m</button>
                    <button onclick="filtrarCategoria('medio')" class="filter-btn px-2.5 py-1 rounded-lg bg-slate-900 border border-slate-800 text-yellow-400 hover:bg-slate-800 transition" data-cat="medio">25-45m</button>
                    <button onclick="filtrarCategoria('alto')" class="filter-btn px-2.5 py-1 rounded-lg bg-slate-900 border border-slate-800 text-orange-400 hover:bg-slate-800 transition" data-cat="alto">45-90m</button>
                    <button onclick="filtrarCategoria('critico')" class="filter-btn px-2.5 py-1 rounded-lg bg-slate-900 border border-slate-800 text-red-400 hover:bg-slate-800 transition" data-cat="critico">&gt;90m / Fuera</button>
                </div>
            </div>

            <!-- List of items -->
            <div id="lista-personas" class="flex-1 overflow-y-auto divide-y divide-slate-900/60 p-2 space-y-1">
                <!-- Dynamically rendered -->
            </div>
        </aside>

        <!-- MAP CONTAINER -->
        <main class="flex-1 relative">
            <div id="map"></div>

            <!-- MAP FLOATING CONTROLS -->
            <div class="absolute top-4 right-4 z-[1000] flex flex-col gap-2 bg-slate-950/90 backdrop-blur border border-slate-800 p-3 rounded-2xl shadow-2xl text-xs">
                <div class="font-bold text-slate-300 mb-1 border-b border-slate-800 pb-1">Convenciones de Tráfico</div>
                <div class="flex items-center gap-2 text-slate-300"><span class="w-3 h-3 rounded-full bg-emerald-500"></span> Flujo Rápido (&lt;25 min)</div>
                <div class="flex items-center gap-2 text-slate-300"><span class="w-3 h-3 rounded-full bg-yellow-500"></span> Tráfico Medio (25-45 min)</div>
                <div class="flex items-center gap-2 text-slate-300"><span class="w-3 h-3 rounded-full bg-orange-500"></span> Congestión Alta (45-90 min)</div>
                <div class="flex items-center gap-2 text-slate-300"><span class="w-3 h-3 rounded-full bg-red-500"></span> Trayecto Crítico / Fuera</div>
                <div class="flex items-center gap-2 text-amber-300 pt-1 border-t border-slate-800 font-semibold"><span class="w-3.5 h-3.5 rounded-full bg-amber-400 border-2 border-white"></span> Sede ACJ La Soledad</div>
            </div>
        </main>
    </div>

EZ EDWIN SANTIAGO", "localidad": "SAN CRISTOBAL", "barrio": "SAN ISIDRO", "direccion": "CARRERA 7 A 35 B 95 SUR", "lat": 4.568535, "lon": -74.0944791, "dist_km": 9.48, "tiempo_min": 18.5, "tiempo_txt": "18 min", "categoria": "bajo", "color": "#10b981", "fuera": "NO", "waze_url": "https://www.waze.com/ul?ll=4.568535%2C-74.0944791&navigate=yes", "gmaps_url": "https://www.google.com/maps/dir/4.568535,-74.0944791/4.625728,-74.078406"}];

        // Inicializar mapa Leaflet
        const map = L.map('map', {
            center: [LAT_SEDE, LON_SEDE],
            zoom: 12,
            zoomControl: false
        });

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Capas de mapa base de alta fidelidad (Esri - 100% libre, sin 403 ni restricciones de API)
        const capaCalles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Streets',
            maxZoom: 19
        }).addTo(map);

        const capaSatelite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Satellite',
            maxZoom: 19
        });

        const capaTopo = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Topographic',
            maxZoom: 19
        });

        // Selector de capas
        L.control.layers({
            "🗺️ Calles y Direcciones (Normal)": capaCalles,
            "🛰️ Satélite": capaSatelite,
            "🏔️ Topográfico": capaTopo
        }, null, { position: 'bottomleft' }).addTo(map);

        // Marcador Sede ACJ
        const iconSede = L.divIcon({
            className: 'sede-marker',
            html: `
                <div class="relative flex items-center justify-center">
                    <div class="absolute w-10 h-10 rounded-full bg-amber-500/40 pulse-sede"></div>
                    <div class="w-8 h-8 rounded-full bg-amber-500 border-2 border-white shadow-xl flex items-center justify-center text-slate-950 font-black text-sm">
                        🏢
                    </div>
                </div>
            `,
            iconSize: [32, 32],
            iconAnchor: [16, 16]
        });

        const markerSede = L.marker([LAT_SEDE, LON_SEDE], { icon: iconSede }).addTo(map);
        markerSede.bindPopup(`
            <div class="bg-slate-900 text-white p-4">
                <div class="text-[10px] uppercase font-bold text-amber-400 tracking-wider">Destino Principal</div>
                <h3 class="text-base font-extrabold text-white mt-0.5">Sede ACJ La Soledad</h3>
                <p class="text-xs text-slate-300 mt-1">Transversal 28 B # 37 - 33, Barrio La Soledad, Bogotá</p>
                <div class="mt-3 pt-2 border-t border-slate-800 text-[11px] text-slate-400">
                    Punto de convergencia de todas las rutas del proyecto.
                </div>
            </div>
        `);

        // Markers de personas
        let markersList = [];
        let categoriaActiva = 'todos';
        let textoBusqueda = '';

        function crearIconoPersona(color) {
            return L.divIcon({
                className: 'person-marker',
                html: `
                    <div class="w-4 h-4 rounded-full border-2 border-white shadow-md transition-transform hover:scale-125" style="background-color: ${color}"></div>
                `,
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });
        }

        function renderizarMapaYLista() {
            markersList.forEach(m => map.removeLayer(m.marker));
            markersList = [];

            const contenedorLista = document.getElementById('lista-personas');
            contenedorLista.innerHTML = '';

            let sumTiempo = 0;
            let sumDist = 0;
            let conteoValidos = 0;

            const puntosFiltrados = PUNTOS.filter(p => {
                const coincideCat = (categoriaActiva === 'todos' || p.categoria === categoriaActiva);
                const coincideTxt = textoBusqueda === '' || 
                    p.nombre.toLowerCase().includes(textoBusqueda) || 
                    p.localidad.toLowerCase().includes(textoBusqueda) || 
                    p.barrio.toLowerCase().includes(textoBusqueda) ||
                    p.direccion.toLowerCase().includes(textoBusqueda);
                return coincideCat && coincideTxt;
            });

            puntosFiltrados.forEach((p) => {
                if (p.tiempo_min > 0) {
                    sumTiempo += p.tiempo_min;
                    sumDist += p.dist_km;
                    conteoValidos++;
                }

                const marker = L.marker([p.lat, p.lon], { icon: crearIconoPersona(p.color) }).addTo(map);
                
                const popupHtml = `
                    <div class="bg-slate-900 text-white p-4 w-72">
                        <div class="flex items-center justify-between gap-2">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full uppercase text-white" style="background-color: ${p.color}">${p.categoria}</span>
                            <span class="text-xs font-semibold text-slate-400">${p.localidad}</span>
                        </div>
                        <h4 class="text-sm font-bold text-white mt-1.5 leading-snug">${p.nombre}</h4>
                        <p class="text-xs text-slate-300 mt-1 flex items-start gap-1">
                            📍 <span>${p.direccion}${p.barrio ? ' (' + p.barrio + ')' : ''}</span>
                        </p>

                        <div class="grid grid-cols-2 gap-2 mt-3 p-2.5 rounded-xl bg-slate-950 border border-slate-800 text-center">
                            <div>
                                <div class="text-[10px] text-slate-400">Tiempo con Tráfico</div>
                                <div class="text-sm font-extrabold text-white mt-0.5">${p.tiempo_txt}</div>
                            </div>
                            <div>
                                <div class="text-[10px] text-slate-400">Distancia Real</div>
                                <div class="text-sm font-extrabold text-white mt-0.5">${p.dist_km} km</div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2 mt-3">
                            <a href="${p.waze_url}" target="_blank" 
                               class="text-center text-xs font-bold py-2 px-3 rounded-xl bg-cyan-500/20 text-cyan-300 hover:bg-cyan-500/30 border border-cyan-500/40 transition flex items-center justify-center gap-1">
                                🚗 Waze en Vivo
                            </a>
                            <a href="${p.gmaps_url}" target="_blank" 
                               class="text-center text-xs font-bold py-2 px-3 rounded-xl bg-indigo-500/20 text-indigo-300 hover:bg-indigo-500/30 border border-indigo-500/40 transition flex items-center justify-center gap-1">
                                🗺️ Google Maps
                            </a>
                        </div>
                    </div>
                `;

                marker.bindPopup(popupHtml);
                markersList.push({ marker, data: p });

                const itemDiv = document.createElement('div');
                itemDiv.className = 'p-3 rounded-xl bg-slate-900/60 hover:bg-slate-800/90 border border-slate-800/80 cursor-pointer transition flex flex-col gap-1.5';
                itemDiv.innerHTML = `
                    <div class="flex items-center justify-between gap-2">
                        <span class="text-xs font-bold text-white truncate">${p.nombre}</span>
                        <span class="text-[11px] font-bold px-2 py-0.5 rounded-md text-white whitespace-nowrap" style="background-color: ${p.color}">
                            ${p.tiempo_txt}
                        </span>
                    </div>
                    <div class="text-[11px] text-slate-400 truncate flex items-center gap-1">
                        <span>📍</span> <span class="truncate">${p.localidad} - ${p.direccion}</span>
                    </div>
                    <div class="text-[10px] text-slate-500 flex items-center justify-between pt-1 border-t border-slate-800/50">
                        <span>Distancia: <strong class="text-slate-300">${p.dist_km} km</strong></span>
                        <span class="text-indigo-400 font-medium hover:underline">Ver ruta →</span>
                    </div>
                `;

                itemDiv.onclick = () => {
                    map.flyTo([p.lat, p.lon], 15, { duration: 1.2 });
                    marker.openPopup();
                };

                contenedorLista.appendChild(itemDiv);
            });

            document.getElementById('stat-total').innerText = puntosFiltrados.length;
            if (conteoValidos > 0) {
                const promMin = Math.round(sumTiempo / conteoValidos);
                const promKm = (sumDist / conteoValidos).toFixed(1);
                document.getElementById('stat-tiempo-prom').innerText = promMin + ' min';
                document.getElementById('stat-dist-prom').innerText = promKm + ' km';
            } else {
                document.getElementById('stat-tiempo-prom').innerText = '-';
                document.getElementById('stat-dist-prom').innerText = '-';
            }
        }

        function filtrarCategoria(cat) {
            categoriaActiva = cat;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.cat === cat) {
                    btn.classList.add('bg-indigo-600', 'text-white');
                    btn.classList.remove('bg-slate-900');
                } else {
                    btn.classList.remove('bg-indigo-600', 'text-white');
                    btn.classList.add('bg-slate-900');
                }
            });
            renderizarMapaYLista();
        }

        document.getElementById('input-buscar').addEventListener('input', (e) => {
            textoBusqueda = e.target.value.toLowerCase().trim();
            renderizarMapaYLista();
        });

        // Iniciar
        renderizarMapaYLista();
    </script>
</body>
</html>
